[project]
name = "ai-log-incident-analyzer"
version = "0.1.0"
description = "AI-assisted log/incident analysis: turns raw error logs into structured, prioritized incidents."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic==1.20.0",
    "asyncpg==0.31.0",
    "fastapi[standard]==0.141.1",
    "groq==1.7.0",
    "pydantic==2.13.5",
    "pymongo==4.20.1",
    "python-dotenv==1.2.3",
    "sqlalchemy[asyncio]==2.0.52",
    "uvicorn[standard]==0.52.4",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets tests import the app/ and eval/ packages without installing the project.
pythonpath = ["."]
markers = [
    "integration: needs a real database - Postgres at TEST_DATABASE_URL or MongoDB at MONGO_TEST_URL (skipped when unset)",
]
