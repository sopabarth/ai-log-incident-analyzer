services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: incident_analyzer
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18+ images expect the mount at the parent dir (not
      # /var/lib/postgresql/data) so they can manage a version-specific
      # subdirectory - see https://github.com/docker-library/postgres/pull/1259
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d incident_analyzer"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Overrides the .env value (which points at localhost:5432 for running
      # the app directly on the host) - inside the compose network, Postgres
      # is reachable at the "db" service name instead.
      DATABASE_URL: postgresql+asyncpg://root:root@db:5432/incident_analyzer
    ports:
      - "8000:8000"

volumes:
  pgdata:
